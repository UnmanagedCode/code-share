<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>code-share — connect</title>
<style>
  /* The host injects no theme into the page, so these values are copied
     from the :root block of code-conductor's shell stylesheet (public/styles.css). */
  :root {
    --bg: #0f1117;
    --panel: #151823;
    --panel-2: #1d2130;
    --text: #d8dae6;
    --muted: #8a90a3;
    --accent: #6ea8ff;
    --green: #4ade80;
    --amber: #f59e0b;
    --red: #f87171;
    --border: #232838;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); padding: 1.5rem; max-width: 600px; margin: 0 auto; }
  h1 { color: var(--text); margin-bottom: 1rem; font-size: 1.3rem; }
  p { color: var(--muted); margin-bottom: 1rem; line-height: 1.5; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
  .cs { color: var(--text); font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; margin-bottom: 0.75rem; }
  button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #262b3d; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .error { color: var(--red); }
</style>
</head>
<body>
<h1>code-share connection</h1>
<div id="content">
  <p>Reading connection data…</p>
</div>
<script>
function b64urlToJson(payload) {
  const b64 = payload.replace(/-/g, '+').replace(/_/g, '/');
  const pad = b64 + '=='.slice(0, (4 - b64.length % 4) % 4);
  return JSON.parse(atob(pad));
}

function render() {
  const content = document.getElementById('content');
  const payload = location.hash.slice(1);

  if (!payload) {
    content.innerHTML = '<p class="error">No connection data in this link.</p>';
    return;
  }

  let parsed;
  try {
    parsed = b64urlToJson(payload);
    if (!parsed || !parsed.url || !parsed.token) throw new Error('missing fields');
  } catch (e) {
    content.innerHTML = '<p class="error">Could not read connection data from this link.</p>';
    return;
  }

  const cs = 'cs1:' + payload;
  content.innerHTML = `
    <p>Paste this connection string into the <strong>Connect</strong> box on
    <em>your own</em> code-share instance's web UI. Scanning this code does not
    connect anything automatically.</p>
    <div class="card">
      <div class="cs" id="cs-text"></div>
      <button id="copy-btn">Copy</button>
    </div>
  `;
  document.getElementById('cs-text').textContent = cs;
  document.getElementById('copy-btn').addEventListener('click', () => {
    navigator.clipboard.writeText(cs).catch(() => {});
  });
}

render();
</script>
</body>
</html>
