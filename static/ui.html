<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>code-share</title>
<style>
  /* The host injects no theme into the plugin iframe, so these values are copied
     from the :root block of code-conductor's shell stylesheet (public/styles.css). */
  :root {
    --bg: #0f1117;
    --panel: #151823;
    --panel-2: #1d2130;
    --text: #d8dae6;
    --muted: #8a90a3;
    --accent: #6ea8ff;
    --green: #4ade80;
    --amber: #f59e0b;
    --red: #f87171;
    --border: #232838;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); padding: 1.5rem; max-width: 900px; margin: 0 auto; }
  h1 { color: var(--text); margin-bottom: 1.5rem; font-size: 1.4rem; }
  h2 { color: var(--muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.1em; margin: 1.5rem 0 0.75rem; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
  .row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
  .label { color: var(--muted); min-width: 100px; flex-shrink: 0; }
  .val { color: var(--text); font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; flex: 1; min-width: 0; }
  #s-status { font-family: inherit; }
  #status-card .val { white-space: nowrap; overflow-x: auto; word-break: normal; }
  #status-card .val::-webkit-scrollbar { height: 4px; }
  #status-card .val::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; }
  .badge-green  { background: rgba(74,222,128,.18); color: var(--green); }
  .badge-gray   { background: var(--panel-2); color: var(--muted); }
  .badge-blue   { background: rgba(110,168,255,.20); color: var(--accent); }
  .badge-yellow { background: rgba(245, 158, 11, .22); color: var(--amber); }
  .badge-orange { background: rgba(248, 113, 113, .22); color: var(--red); }
  button, input {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font: inherit;
  }
  button { cursor: pointer; flex-shrink: 0; }
  button:hover:not(:disabled) { background: #262b3d; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  input { width: 100%; }
  #c-cs { font-family: ui-monospace, monospace; font-size: 12px; }
  /* Accent fill is reserved for a form's submit action. */
  button.primary { background: var(--accent); color: #0a0c12; border-color: var(--accent); font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #8cb9ff; border-color: #8cb9ff; }
  button.primary:disabled { background: var(--panel-2); color: var(--muted); border-color: var(--border); font-weight: 400; }
  /* Quiet tints: start = green, destructive = red, caution (rewrites local history) = amber. */
  button.start { color: var(--green); border-color: var(--green); background: rgba(74, 222, 128, 0.15); }
  button.start:hover:not(:disabled) { background: rgba(74, 222, 128, 0.25); }
  button.danger { color: var(--red); border-color: var(--red); background: rgba(248, 113, 113, 0.15); }
  button.danger:hover:not(:disabled) { background: rgba(248, 113, 113, 0.25); }
  button.caution { background: rgba(245,158,11,.15); color: var(--amber); border-color: var(--amber); }
  button.caution:hover:not(:disabled) { background: rgba(245,158,11,.25); }
  .copy-btn { min-width: 60px; }
  .project-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
  .project-row:last-child { border-bottom: none; }
  .project-row > .project-info { flex: 1 1 200px; min-width: 0; overflow: hidden; }
  .project-name { font-weight: bold; }
  .project-path { color: var(--muted); font-family: ui-monospace, monospace; font-size: 0.8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project-controls { display: flex; align-items: center; gap: 0.5rem; flex: 0 0 auto; }
  .leader-toggle { display: flex; align-items: center; gap: 0.25rem; color: var(--text); font-size: 0.85rem; cursor: pointer; white-space: nowrap; user-select: none; }
  .leader-toggle input[type="checkbox"] { width: auto; margin: 0; padding: 0; accent-color: var(--accent); }
  .error { color: var(--red); font-size: 0.85rem; margin-top: 0.5rem; }
  .success { color: var(--green); font-size: 0.85rem; margin-top: 0.5rem; }
  .section-row { display: flex; gap: 0.5rem; align-items: flex-end; margin-bottom: 0.75rem; }
  .section-row > div { flex: 1; min-width: 0; }
  .section-row label { color: var(--muted); font-size: 0.8rem; display: block; margin-bottom: 4px; }
  #connect-msg { margin-top: 0.5rem; font-size: 0.85rem; }
  .peer-card { margin-bottom: 0.75rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
  .peer-card:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .peer-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.35rem; }
  .peer-projects { padding-left: 1rem; margin-top: 0.35rem; }
  .peer-sync-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem; padding: 3px 0; font-size: 0.8rem; }
  .sync-indicator { font-size: 0.75rem; margin-left: 2px; }
  @media (max-width: 600px) {
    #status-card .row { flex-wrap: wrap; }
    #status-card .row .val { flex-basis: 100%; }
  }
</style>
<script src="/pluginBridge.js" defer></script>
<script src="vendor/qrcode.js"></script>
</head>
<body>
<h1>code-share</h1>

<h2>Your Link</h2>
<div class="card" id="status-card">
  <div class="row"><span class="label">Status</span><span class="val" id="s-status">Loading…</span></div>
  <div class="row"><span class="label">LAN URL</span><span class="val" id="s-lan">—</span><button class="copy-btn" onclick="copy('s-lan')">Copy</button></div>
  <div class="row"><span class="label">Tunnel URL</span><span class="val" id="s-tunnel">—</span><button class="copy-btn" onclick="copy('s-tunnel')">Copy</button><button class="start" id="tunnel-btn" onclick="tunnelBtnClick()">Start tunnel</button></div>
  <div class="row"><span class="label">Connection</span><span class="val" id="s-cs">—</span><button class="copy-btn" onclick="copy('s-cs')">Copy</button><button class="secondary" id="qr-btn" onclick="toggleQR()" disabled>Show QR</button></div>
  <div id="qr-panel" style="display:none; margin-top:0.75rem; text-align:center">
    <div id="qr-code" style="display:inline-block; background:#fff; padding:12px; border-radius:6px; line-height:0"></div>
  </div>
  <div id="qr-msg" style="font-size:0.85rem;margin-top:0.25rem"></div>
  <div id="tunnel-msg" style="font-size:0.85rem;margin-top:0.25rem"></div>
</div>

<h2>Projects under PROJECTS_ROOT</h2>
<div class="card" id="projects-card"><div style="color:var(--muted)">Loading…</div></div>

<h2>Connect a Peer</h2>
<div class="card">
  <div class="section-row">
    <div>
      <label>Connection string (paste peer's cs1:… string)</label>
      <input id="c-cs" placeholder="cs1:…">
    </div>
  </div>
  <div class="section-row">
    <div><label>Peer name (local label)</label><input id="c-name" value="peer"></div>
  </div>
  <button class="primary" onclick="doConnect()">Connect</button>
  <div id="connect-msg"></div>
</div>

<h2>Connected Peers</h2>
<div class="card" id="peers-card"><div style="color:var(--muted)">No peers connected.</div></div>

<script>
let status = null;
let sharedRegistry = [];
let tunnelBusy = false;

// ── Connection string helpers ────────────────────────────────────────────────

function makeConnectionString(rawUrl, token) {
  if (!rawUrl || rawUrl === '—') return null;
  try {
    const u = new URL(rawUrl);
    u.username = '';
    u.password = '';
    const bare = u.toString().replace(/\/$/, '');
    const json = JSON.stringify({ url: bare, token });
    return 'cs1:' + btoa(json).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
  } catch { return null; }
}

function parseConnectionString(s) {
  if (!s || !s.startsWith('cs1:')) return null;
  try {
    const b64 = s.slice(4).replace(/-/g, '+').replace(/_/g, '/');
    const pad = b64 + '=='.slice(0, (4 - b64.length % 4) % 4);
    return JSON.parse(atob(pad));
  } catch { return null; }
}

// ── Main load ────────────────────────────────────────────────────────────────

async function load() {
  try {
    const [s, p] = await Promise.all([
      fetch('api/status').then(r => r.json()),
      fetch('api/projects').then(r => r.json())
    ]);
    status = s;
    sharedRegistry = s.shared || [];
    renderStatus(s);
    renderProjects(p, sharedRegistry);
    renderPeers(s.peers || []);
  } catch(e) {
    document.getElementById('s-status').textContent = 'Error: ' + e.message;
  }
}

// ── Render helpers ───────────────────────────────────────────────────────────

function renderStatus(s) {
  document.getElementById('s-status').innerHTML = '<span class="badge badge-green">serving</span>';

  const lanRaw    = s.selfUrl   || null;
  const tunnelRaw = s.tunnelUrl || null;
  document.getElementById('s-lan').textContent    = lanRaw    || '—';
  document.getElementById('s-tunnel').textContent = tunnelRaw || '—';

  const sourceUrl = tunnelRaw || lanRaw;
  const cs = makeConnectionString(sourceUrl, s.token);
  const csEl = document.getElementById('s-cs');
  if (cs) {
    csEl.textContent = cs;
  } else {
    csEl.textContent = '— (start tunnel or connect LAN first)';
    csEl.style.color = 'var(--muted)';
  }

  const qrBtn = document.getElementById('qr-btn');
  qrBtn.disabled = !cs;
  if (!cs) {
    document.getElementById('qr-panel').style.display = 'none';
    qrBtn.textContent = 'Show QR';
  }

  renderTunnelButton(s);
}

function renderTunnelButton(s) {
  const btn = document.getElementById('tunnel-btn');
  if (!btn) return;
  const busy = tunnelBusy || s.tunnelStarting;
  if (busy) {
    btn.disabled = true;
    btn.className = 'secondary';
    btn.textContent = 'Starting… (up to 30s)';
    return;
  }
  btn.disabled = false;
  if (s.tunnelUrl) {
    btn.className = 'danger';
    btn.textContent = 'Stop tunnel';
  } else {
    btn.className = 'start';
    btn.textContent = 'Start tunnel';
  }
}

function renderProjects(allProjects, sharedProjects) {
  const card = document.getElementById('projects-card');
  if (!allProjects.length) {
    card.innerHTML = '<div style="color:var(--muted)">No git repos found in PROJECTS_ROOT.</div>';
    return;
  }
  const sharedMap = new Map(sharedProjects.map(p => [p.name, p]));

  card.innerHTML = allProjects.map(p => {
    const sharedEntry = sharedMap.get(p.name);
    const isShared = p.shared || !!sharedEntry;
    const isLeader = sharedEntry ? (sharedEntry.leader === true) : false;

    const nameWithBadge = isShared
      ? `${esc(p.name)} <span class="badge badge-green" style="margin-left:4px">shared</span>`
      : esc(p.name);

    const controls = isShared
      ? `<div class="project-controls">
          <label class="leader-toggle">
            <input type="checkbox" ${isLeader ? 'checked' : ''}
                   onchange="setProjectLeader('${esc(p.name)}', this.checked)">
            Leader
          </label>
          <button class="danger" onclick="unshare('${esc(p.name)}')">Unshare</button>
         </div>`
      : `<div class="project-controls">
          <button class="start" onclick="share('${esc(p.path)}', '${esc(p.name)}')">Share</button>
         </div>`;

    return `<div class="project-row">
      <div class="project-info">
        <div class="project-name">${nameWithBadge}</div>
        <div class="project-path" title="${esc(p.path)}">${esc(p.path)}</div>
      </div>
      ${controls}
    </div>`;
  }).join('');
}

function renderPeers(peers) {
  const card = document.getElementById('peers-card');
  if (!peers.length) {
    card.innerHTML = '<div style="color:var(--muted)">No peers connected.</div>';
    return;
  }
  card.innerHTML = peers.map(p =>
    `<div class="peer-card">
      <div class="peer-header">
        <span style="font-weight:bold">${esc(p.name)}</span>
        <span class="val" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.url)}</span>
      </div>
      <div class="peer-projects" id="peer-proj-${esc(p.name)}">
        <span style="color:var(--muted);font-size:0.8rem">Loading…</span>
      </div>
    </div>`
  ).join('');

  for (const p of peers) {
    loadPeerProjects(p.name);
  }
}

function syncRowHTML(peerName, name) {
  return `<div class="peer-sync-row" id="psrow-${esc(peerName)}-${esc(name)}">
      <span class="badge badge-green">${esc(name)}</span>
      <span class="sync-indicator" id="psi-${esc(peerName)}-${esc(name)}"></span>
      <button class="secondary" id="psf-${esc(peerName)}-${esc(name)}" onclick="fetchPeerProjectSync('${esc(name)}','${esc(peerName)}')">↻ Fetch</button>
      <button class="caution" id="pss-${esc(peerName)}-${esc(name)}" onclick="syncPeerProject('${esc(name)}','${esc(peerName)}')">↕ Sync</button>
    </div>`;
}

function cloneRowHTML(peerName, name) {
  return `<div class="peer-sync-row" id="pcrow-${esc(peerName)}-${esc(name)}">
      <span class="badge badge-gray">${esc(name)}</span>
      <span style="color:var(--muted);font-size:0.75rem">peer only</span>
      <span class="sync-indicator" id="pci-${esc(peerName)}-${esc(name)}"></span>
      <button class="start" onclick="clonePeerProject('${esc(name)}','${esc(peerName)}',this)">⬇ Clone</button>
    </div>`;
}

async function loadPeerProjects(peerName) {
  const el = document.getElementById('peer-proj-' + peerName);
  if (!el) return;

  const norm = s => String(s == null ? '' : s).trim();
  const localByName = new Map(sharedRegistry.map(p => [norm(p.name), p]));

  // Offline fallback: projects the local registry already has wired to this peer.
  // Used only when the peer's live catalog is unreachable.
  const wired = sharedRegistry.filter(p => (p.peers || []).some(pe => pe.name === peerName));

  // Show the wired list immediately so something renders before the catalog loads.
  el.innerHTML = wired.length
    ? wired.map(p => syncRowHTML(peerName, p.name)).join('')
    : '<span style="color:var(--muted);font-size:0.8rem">Checking peer…</span>';

  let data;
  try {
    data = await fetch(`api/peer-status?peer=${encodeURIComponent(peerName)}`).then(r => r.json());
  } catch (e) {
    data = { error: e.message };
  }

  if (data.error) {
    // Peer unreachable — keep the wired fallback; if none, report offline.
    if (!wired.length) {
      el.innerHTML = `<span style="color:var(--red);font-size:0.8rem">Offline: ${esc(data.error)}</span>`;
    }
    return;
  }

  // Peer reachable: the live catalog is the source of truth. A project is
  // syncable iff it exists in BOTH the peer's catalog and my local registry
  // (matched by name) — independent of whether registry peers[] was wired.
  // Everything the peer exposes that I don't have locally gets a Clone button.
  const catalog = data.shared || [];
  const syncable = [];
  const peerOnly = [];
  for (const ps of catalog) {
    const local = localByName.get(norm(ps.name));
    if (local) syncable.push(local.name);
    else peerOnly.push(ps.name);
  }

  const rows = [
    ...syncable.map(n => syncRowHTML(peerName, n)),
    ...peerOnly.map(n => cloneRowHTML(peerName, n))
  ];
  el.innerHTML = rows.length
    ? rows.join('')
    : '<span style="color:var(--muted);font-size:0.8rem">Peer exposes no projects.</span>';
}

// ── Actions ──────────────────────────────────────────────────────────────────

async function share(repoPath, name) {
  const resp = await fetch('api/share', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ path: repoPath, name }) });
  const data = await resp.json();
  if (data.error) alert('Error: ' + data.error);
  else load();
}

async function unshare(name) {
  if (!confirm(`Unshare "${name}"?`)) return;
  const resp = await fetch('api/unshare', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name }) });
  const data = await resp.json();
  if (data.error) alert('Error: ' + data.error);
  else load();
}

function tunnelBtnClick() {
  if (status && status.tunnelUrl) stopTunnel();
  else startTunnelFromUI();
}

async function startTunnelFromUI() {
  const msg = document.getElementById('tunnel-msg');
  if (msg) msg.innerHTML = '';
  tunnelBusy = true;
  if (status) renderTunnelButton(status);
  try {
    const resp = await fetch('api/tunnel/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'cloudflared' })
    });
    const data = await resp.json();
    if (data.error && msg) msg.innerHTML = `<span class="error">${esc(data.error)}</span>`;
  } catch (e) {
    if (msg) msg.innerHTML = `<span class="error">${esc(e.message)}</span>`;
  } finally {
    tunnelBusy = false;
    load();
  }
}

async function stopTunnel() {
  const msg = document.getElementById('tunnel-msg');
  if (msg) msg.innerHTML = '';
  tunnelBusy = true;
  if (status) renderTunnelButton(status);
  try {
    const resp = await fetch('api/tunnel/stop', { method: 'POST' });
    const data = await resp.json();
    if (data.error && msg) msg.innerHTML = `<span class="error">${esc(data.error)}</span>`;
  } catch (e) {
    if (msg) msg.innerHTML = `<span class="error">${esc(e.message)}</span>`;
  } finally {
    tunnelBusy = false;
    load();
  }
}

async function setProjectLeader(name, leader) {
  const resp = await fetch('api/project-leader', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, leader })
  });
  const data = await resp.json();
  if (data.error) alert('Error setting leader: ' + data.error);
}

function renderSyncBadge(state, ahead, behind) {
  return state === 'in-sync'        ? `<span class="badge badge-green">✓ in sync</span>`
       : state === 'local-ahead'    ? `<span class="badge badge-blue">↑${ahead} ahead</span>`
       : state === 'remote-ahead'   ? `<span class="badge badge-yellow">↓${behind} behind</span>`
       : `<span class="badge badge-orange">↕ diverged (↑${ahead} ↓${behind})</span>`;
}

// The periodic setInterval(load, 15000) refresh can rebuild a peer's project
// list (syncRowHTML) while a Fetch/Sync request is in flight, replacing the
// row's DOM nodes out from under any reference captured at call time. Always
// re-resolve by id — including AFTER the await — so a badge/button update
// never lands on a detached, orphaned node.
function setSyncIndicator(peerName, projectName, html) {
  const el = document.getElementById(`psi-${peerName}-${projectName}`);
  if (el) el.innerHTML = html;
}

function setSyncButton(id, disabled, text) {
  const btn = document.getElementById(id);
  if (btn) { btn.disabled = disabled; btn.textContent = text; }
}

async function fetchPeerProjectSync(projectName, peerName) {
  const btnId = `psf-${peerName}-${projectName}`;
  setSyncIndicator(peerName, projectName, '<span style="color:var(--muted)"> ↻</span>');
  setSyncButton(btnId, true, '…');
  try {
    const data = await fetch(
      `api/sync-status?project=${encodeURIComponent(projectName)}&remote=${encodeURIComponent(peerName)}`
    ).then(r => r.json());
    if (data.error) {
      setSyncIndicator(peerName, projectName, ` <span class="badge badge-gray" title="${esc(data.error)}">err</span>`);
    } else {
      setSyncIndicator(peerName, projectName, ' ' + renderSyncBadge(data.state, data.ahead, data.behind));
    }
  } catch (e) {
    setSyncIndicator(peerName, projectName, ` <span class="badge badge-gray" title="${esc(e.message)}">err</span>`);
  } finally {
    setSyncButton(btnId, false, '↻ Fetch');
  }
}

// Real pull-only sync (POST /api/sync): fetch + merge/rebase per src/sync.js's
// leader-derived mode, never pushes. Refreshes the badge from the response on
// success; on failure shows a "sync failed" badge with the full error (e.g. a
// rebase-conflict file list) in the title, since sync errors are the whole
// reason this button exists — they must not be swallowed silently.
async function syncPeerProject(projectName, peerName) {
  const btnId = `pss-${peerName}-${projectName}`;
  setSyncIndicator(peerName, projectName, '<span style="color:var(--muted)"> syncing…</span>');
  setSyncButton(btnId, true, '…');
  try {
    const data = await fetch('api/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ project: projectName, remote: peerName })
    }).then(r => r.json());
    if (data.error) {
      setSyncIndicator(peerName, projectName, ` <span class="badge badge-gray" title="${esc(data.error)}">sync failed</span>`);
    } else {
      setSyncIndicator(peerName, projectName, ' ' + renderSyncBadge(data.state, data.ahead, data.behind));
    }
  } catch (e) {
    setSyncIndicator(peerName, projectName, ` <span class="badge badge-gray" title="${esc(e.message)}">sync failed</span>`);
  } finally {
    setSyncButton(btnId, false, '↕ Sync');
  }
}

// Clone a peer-only project into PROJECTS_ROOT, register it, and wire the peer
// remote (backend /api/clone). On success the project becomes syncable and the
// UI reloads so it moves to a Sync row.
async function clonePeerProject(projectName, peerName, btn) {
  const indicator = document.getElementById(`pci-${peerName}-${projectName}`);
  if (indicator) indicator.innerHTML = '<span style="color:var(--muted)"> cloning…</span>';
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    const data = await fetch('api/clone', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ peer: peerName, project: projectName })
    }).then(r => r.json());
    if (data.error) {
      if (indicator) indicator.innerHTML = ` <span class="badge badge-gray" title="${esc(data.error)}">clone failed</span>`;
      if (btn) { btn.disabled = false; btn.textContent = '⬇ Clone'; }
      return;
    }
    load(); // re-render: the project is now local + syncable
  } catch (e) {
    if (indicator) indicator.innerHTML = ` <span class="badge badge-gray" title="${esc(e.message)}">clone failed</span>`;
    if (btn) { btn.disabled = false; btn.textContent = '⬇ Clone'; }
  }
}

async function doConnect() {
  const csInput = document.getElementById('c-cs').value.trim();
  const name    = document.getElementById('c-name').value.trim() || 'peer';
  const msg     = document.getElementById('connect-msg');

  if (!csInput) { msg.innerHTML = '<span class="error">Connection string is required</span>'; return; }

  let peerUrl, peerToken;
  const parsed = parseConnectionString(csInput);
  if (parsed) {
    peerUrl   = parsed.url;
    peerToken = parsed.token;
  } else {
    try {
      const u = new URL(csInput);
      if (u.password) { peerToken = u.password; u.username = ''; u.password = ''; }
      peerUrl = u.toString().replace(/\/$/, '');
    } catch {
      msg.innerHTML = '<span class="error">Invalid connection string — paste the cs1:… value from the peer\'s UI</span>';
      return;
    }
  }

  msg.innerHTML = '<span style="color:var(--muted)">Connecting…</span>';
  try {
    const resp = await fetch('api/connect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: peerUrl, token: peerToken, name })
    });
    const data = await resp.json();
    if (data.error) {
      msg.innerHTML = `<span class="error">Error: ${esc(data.error)}</span>`;
    } else {
      msg.innerHTML = '<span class="success">Connected! Toggle the Leader checkbox per project if needed.</span>';
      load();
    }
  } catch(e) {
    msg.innerHTML = `<span class="error">Error: ${esc(e.message)}</span>`;
  }
}

function copy(id) {
  const text = document.getElementById(id).textContent;
  if (text && text !== '—' && !text.startsWith('—')) navigator.clipboard.writeText(text).catch(() => {});
}

function qrTextFor(text) {
  if (!text.startsWith('cs1:')) return text;
  try {
    const payload = text.slice(4);
    const b64 = payload.replace(/-/g,'+').replace(/_/g,'/');
    const padded = b64 + '='.repeat((4 - b64.length % 4) % 4);
    const peerUrl = JSON.parse(atob(padded)).url;
    if (!peerUrl) return text;
    return peerUrl.replace(/\/+$/, '') + '/connect#' + payload;
  } catch (e) {
    return text;
  }
}

function toggleQR() {
  const text = document.getElementById('s-cs').textContent;
  if (!text || text === '—' || text.startsWith('—')) return;

  const panel = document.getElementById('qr-panel');
  const btn = document.getElementById('qr-btn');
  const msg = document.getElementById('qr-msg');
  if (msg) msg.innerHTML = '';

  const showing = panel.style.display !== 'none';
  if (showing) {
    panel.style.display = 'none';
    btn.textContent = 'Show QR';
    return;
  }

  try {
    const qrText = qrTextFor(text);
    const qr = qrcode(0, 'M');
    qr.addData(qrText);
    qr.make();
    document.getElementById('qr-code').innerHTML = qr.createSvgTag(4);
    panel.style.display = 'block';
    btn.textContent = 'Hide QR';
  } catch (e) {
    if (msg) msg.innerHTML = `<span class="error">Could not generate QR code: ${esc(e.message)}</span>`;
  }
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

load();
setInterval(load, 15000);
</script>
